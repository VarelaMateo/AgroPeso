<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://www.w3schools.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8000 https://agropeso-production.up.railway.app; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroPeso - Mis pesadas</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* CSS propio: solo lo que W3.CSS no puede hacer (degradados, fuente y detalles del diseño) */
    :root {
      --azul-oscuro: #0a3fa8;   /* cambiá estos dos para ajustar el azul */
      --azul-claro: #3d8bff;
      --gris-panel: #f5f5f5;
    }

    body, h1, h2, h3, table, input, button, select {
      font-family: "Poppins", sans-serif;
    }
    body { background: #fff; } /* explícito: sin esto, un navegador en modo oscuro pinta el fondo negro */

    /* Barra superior y paneles */
    .barra-superior {
      background: var(--gris-panel);
      border-radius: 40px;
      padding: 12px 20px;
    }

    /* Alinea verticalmente las tres zonas de la barra */
    .barra-superior > .w3-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }

    .nombre-proveedor {
      font-size: 26px;
      font-weight: 600;
    }

    .panel-tabla {
      background: var(--gris-panel);
      border-radius: 20px;
      padding: 16px;
      height: 360px;
      overflow: auto;
    }

    .panel-tabla th { color: var(--azul-oscuro); }

    /* Buscador: mismo color de fondo que la barra, con borde */
    .buscador {
      width: 100%;
      background: transparent;
      border: 1px solid #c4c4c4;
      border-radius: 999px;
      padding: 8px 16px;
      text-align: center;
      font-size: 15px;
    }
    .buscador:focus {
      outline: none;
      border-color: var(--azul-oscuro);
    }

    .btn-buscar {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(160deg, var(--azul-oscuro), var(--azul-claro));
    }

    /* Botón de descarga: chico, al lado del buscador */
    .btn-descargar {
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      background: linear-gradient(160deg, var(--azul-oscuro), var(--azul-claro));
    }

    /* Filtros combinables debajo de la barra */
    .barra-filtros { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin: 12px 8px 0; }
    .barra-filtros .filtro { display: flex; flex-direction: column; min-width: 150px; }
    .barra-filtros label { font-size: 12px; padding-left: 12px; color: #757575; }
    .barra-filtros select, .barra-filtros input {
      background: var(--gris-panel);
      border: 1px solid #c4c4c4;
      border-radius: 999px;
      padding: 6px 12px;
    }
    .btn-limpiar {
      background: var(--gris-panel);
      border: 1px solid #c4c4c4;
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }

    /* Acceso a Mis Facturas: mismo estilo que Descargar Excel */
    .btn-facturas {
      display: inline-block;
      border-radius: 999px;
      padding: 8px 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      background: linear-gradient(160deg, var(--azul-oscuro), var(--azul-claro));
    }

    .btn-salir {
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    /* Tarjetas de estadísticas */
    .tarjeta {
      border-radius: 18px;
      padding: 16px;
      min-height: 130px;
    }
    .tarjeta-azul {
      color: #fff;
      background: linear-gradient(160deg, var(--azul-oscuro) 0%, var(--azul-claro) 100%);
    }
    .tarjeta-gris {
      background: var(--gris-panel);
    }
    .tarjeta .numero {
      font-size: 32px;
      font-weight: 600;
      margin: 8px 0 0;
    }
    .icono-circulo {
      width: 36px;
      height: 36px;
      line-height: 36px;
      text-align: center;
      border-radius: 50%;
      float: right;
    }

    /* Etiqueta de estado "cerrado" (la usa cliente.js) */
    .estado-cerrado {
      background: var(--azul-oscuro);
      color: #fff;
    }
  </style>
</head>
<body data-clase-oscura="cliente-oscuro">
  <script src="../js/tema.js"></script>

  <main class="w3-padding">

    <!-- Barra superior -->
    <header class="barra-superior">
      <div class="w3-row">
        <div class="w3-col m3 s12 w3-padding w3-center">
          <b id="nombre-proveedor" class="nombre-proveedor">Cargando...</b>
        </div>

        <div class="w3-col m5 s12">
          <div class="w3-row">
            <div class="w3-col" style="width: 56px;">
              <button id="btn-buscar" type="button" class="btn-buscar" aria-label="Buscar">🔍</button>
            </div>
            <div class="w3-col w3-right" style="width: auto; padding-left: 8px;">
              <button id="btn-descargar" type="button" class="btn-descargar"
                      title="Descarga en CSV (Excel) los tickets filtrados">Descargar Excel</button>
            </div>
            <div class="w3-rest">
              <input id="buscador" class="buscador" type="search"
                     placeholder="buscar por patente o chofer" autocomplete="off">
            </div>
          </div>
        </div>

        <div class="w3-col m4 s12 w3-right-align w3-padding">
          <a href="cliente_facturas.html" class="btn-facturas">Facturas</a>
          <button id="btn-salir" type="button" class="btn-salir">cerrar sesión</button>
          <br>
          <span id="fecha-hora" class="w3-small w3-text-grey"></span>
        </div>
      </div>
    </header>

    <!-- Filtros combinables (AND): afectan "Todos los tickets", el total neto filtrado y la descarga -->
    <section class="barra-filtros" aria-label="Filtros">
      <div class="filtro">
        <label for="filtro-producto">Producto</label>
        <select id="filtro-producto">
          <option value="">Todos los productos</option>
        </select>
      </div>
      <div class="filtro">
        <label for="filtro-desde">Desde</label>
        <input id="filtro-desde" type="date">
      </div>
      <div class="filtro">
        <label for="filtro-hasta">Hasta</label>
        <input id="filtro-hasta" type="date">
      </div>
      <button id="btn-limpiar-filtros" type="button" class="btn-limpiar">Limpiar filtros</button>
      <span id="aviso-exportar" class="w3-text-red w3-small" role="status" style="display: none;"></span>
    </section>

    <h1 class="w3-xxxlarge"><b>Tickets</b></h1>

    <!-- Tablas (ocupan todo el ancho) -->
    <div class="w3-row-padding">

      <section class="w3-col m7 w3-margin-bottom">
        <h2 class="w3-xlarge"><b>Todos los tickets</b></h2>
        <div class="panel-tabla">
          <table class="w3-table w3-hoverable">
            <thead>
              <tr>
                <th>ID</th><th>Fecha</th><th>Chofer</th><th>Patente</th><th>Producto</th>
                <th>Tara</th><th>Bruto</th><th>Neto</th><th>Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-todos">
              <tr><td colspan="9" class="w3-center">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="w3-col m5 w3-margin-bottom">
        <h2 class="w3-xlarge"><b>Tickets del mes</b></h2>
        <div class="panel-tabla">
          <table class="w3-table w3-hoverable">
            <thead>
              <tr>
                <th>ID</th><th>Fecha</th><th>Patente</th><th>Producto</th><th>Neto</th><th>Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-mes">
              <tr><td colspan="6" class="w3-center">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </div>

    <!-- Tarjetas de estadísticas -->
    <section class="w3-content w3-row-padding w3-margin-top w3-margin-bottom" style="max-width: 1140px;">

      <div class="w3-quarter w3-margin-bottom">
        <div class="tarjeta tarjeta-azul">
          <div class="icono-circulo w3-white">🚚</div>
          <span class="w3-small">Total de pesadas</span>
          <p class="numero" id="stat-total">—</p>
          <span id="stat-variacion" class="w3-tiny"></span>
        </div>
      </div>

      <div class="w3-quarter w3-margin-bottom">
        <div class="tarjeta tarjeta-gris">
          <div class="icono-circulo w3-black">⏳</div>
          <span class="w3-small w3-text-grey">Pesadas abiertas</span>
          <p class="numero" id="stat-abiertas">—</p>
        </div>
      </div>

      <div class="w3-quarter w3-margin-bottom">
        <div class="tarjeta tarjeta-gris">
          <div class="icono-circulo w3-black">⚖️</div>
          <span class="w3-small w3-text-grey">Total neto filtrado</span>
          <p class="numero" id="stat-neto-filtrado">—</p>
          <span id="stat-cerradas-filtradas" class="w3-tiny w3-text-grey"></span>
        </div>
      </div>

      <div class="w3-quarter w3-margin-bottom">
        <div class="tarjeta tarjeta-azul">
          <span class="w3-small">Peso neto promedio del mes</span>
          <p class="numero" id="stat-neto-promedio">—</p>
        </div>
      </div>

    </section>
  </main>

  <button id="btn-tema" type="button" class="boton-tema" aria-label="Cambiar entre tema claro y oscuro">🌙 Modo oscuro</button>

  <script src="../js/auth.js"></script>
  <script src="../js/exportar.js"></script>
  <script src="../js/cliente.js"></script>
</body>
</html>
