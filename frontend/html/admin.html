<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://www.w3schools.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8000 https://agropeso-production.up.railway.app; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroPeso - Panel del administrador</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* Único CSS propio: lo que W3.CSS no puede hacer */
    body { font-family: "Poppins", sans-serif; }
    h1, h2, h3, h4, h5, h6, button, input, select { font-family: inherit; }

    /* Barra superior */
    .barra-superior { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding: 16px 24px; }
    .barra-superior .botones-barra { margin-left: auto; display: flex; gap: 8px; }

    /* Barra de filtros combinables */
    .barra-filtros { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 0 24px 8px; }
    .barra-filtros .filtro { display: flex; flex-direction: column; min-width: 150px; }
    .barra-filtros label { font-size: 12px; padding-left: 12px; }
    .barra-filtros select, .barra-filtros input { padding: 6px 12px; }
    .buscador-caja { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; max-width: 480px; padding: 6px 14px; }
    .punto { width: 22px; height: 22px; flex: none; }

    /* Panel principal: tres columnas del mismo alto que llenan la pantalla */
    .panel-principal {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: stretch;
      padding: 8px 24px 24px;
      min-height: calc(100vh - 100px);
    }
    .col { display: flex; flex-direction: column; }
    .col-form, .col-centro { flex: 1 1 300px; }
    .col-tabla { flex: 2 1 480px; min-width: 0; }

    /* Columna izquierda: formulario centrado y repartido en toda la altura */
    .tarjeta-brillo {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 14px;
      padding: 24px 8%;
      background:
        radial-gradient(circle at 100% 100%, rgba(139, 195, 74, 0.6) 0%, rgba(139, 195, 74, 0) 55%),
        #f1f1f1;
    }
    .tarjeta-brillo > * { width: 100%; max-width: 360px; margin: 0 auto; }
    .tarjeta-brillo p { margin: 0; }

    /* Columna central: acciones y estadísticas con más aire */
    .col-centro { gap: 24px; }
    .grupo-acciones { display: flex; flex-direction: column; gap: 18px; }
    .grupo-acciones h2 { margin: 0 0 4px; }
    .btn-accion { display: flex; align-items: center; justify-content: space-between; width: 100%; padding-top: 14px; padding-bottom: 14px; }
    .flecha { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .tarjeta-stat { flex: 1; display: flex; flex-direction: column; justify-content: center; }

    /* Columna derecha: la caja punteada ocupa el resto de la altura */
    .caja-punteada { flex: 1; border: 1px dashed #777; }
    .titulo-tabla { text-transform: uppercase; letter-spacing: 0.5px; }
  </style>
</head>
<body class="w3-white">
  <script src="../js/tema.js"></script>

  <!-- Barra superior -->
  <header class="barra-superior">
    <div>
      <span class="w3-small w3-text-grey">Hola</span><br>
      <b id="nombre-usuario" style="text-transform: capitalize;"></b>
    </div>

    <div class="buscador-caja w3-light-grey w3-round-xxlarge">
      <span class="w3-circle w3-light-green punto"></span>
      <input id="buscador" class="w3-input w3-border-0 w3-transparent" type="search"
             placeholder="Buscar por patente, chofer o proveedor" aria-label="Buscar tickets">
    </div>

    <div class="botones-barra">
      <button id="btn-exportar" type="button" class="w3-button w3-green w3-round-xxlarge"
              title="Descarga en CSV (Excel) los tickets que se ven en la tabla">
        Exportar Excel
      </button>
      <a id="btn-facturas" href="facturas.html" class="w3-button w3-blue w3-round-xxlarge"
         title="Estado de facturación por proveedor">Facturas</a>
      <button id="btn-logout" type="button" class="w3-button w3-light-green w3-round-xxlarge">
        Cerrar sesión
      </button>
    </div>
  </header>

  <!-- Filtros combinables (AND): afectan la tabla y el archivo exportado -->
  <section class="barra-filtros" aria-label="Filtros">
    <div class="filtro">
      <label for="filtro-proveedor" class="w3-text-grey">Proveedor</label>
      <select id="filtro-proveedor" class="w3-select w3-border w3-round-xxlarge w3-white">
        <option value="">Todos los proveedores</option>
      </select>
    </div>
    <div class="filtro">
      <label for="filtro-producto" class="w3-text-grey">Producto</label>
      <select id="filtro-producto" class="w3-select w3-border w3-round-xxlarge w3-white">
        <option value="">Todos los productos</option>
      </select>
    </div>
    <div class="filtro">
      <label for="filtro-desde" class="w3-text-grey">Desde</label>
      <input id="filtro-desde" type="date" class="w3-input w3-border w3-round-xxlarge">
    </div>
    <div class="filtro">
      <label for="filtro-hasta" class="w3-text-grey">Hasta</label>
      <input id="filtro-hasta" type="date" class="w3-input w3-border w3-round-xxlarge">
    </div>
    <button id="btn-limpiar-filtros" type="button" class="w3-button w3-light-grey w3-round-xxlarge">Limpiar filtros</button>
    <span id="aviso-exportar" class="w3-text-red w3-small" role="status" style="display: none;"></span>
  </section>

  <main class="panel-principal">

    <!-- Columna izquierda: Nuevo ticket -->
    <section class="col col-form">
      <form id="form-pesaje" class="tarjeta-brillo w3-round-xlarge">
        <h4 class="w3-center w3-text-light-green"><b>NUEVO TICKET</b></h4>

        <p>
          <label for="fecha" class="w3-text-grey">Fecha <small>(hoy si no se cambia)</small></label>
          <input class="w3-input w3-border w3-border-black w3-round-xxlarge w3-white w3-padding"
                 type="date" id="fecha" name="fecha" required>
        </p>

        <p>
          <label for="chofer" class="w3-text-grey">Chofer</label>
          <input class="w3-input w3-border w3-border-black w3-round-xxlarge w3-white w3-padding"
                 type="text" id="chofer" name="chofer" maxlength="200" required>
        </p>
        <p>
          <label for="patente" class="w3-text-grey">Patente</label>
          <input class="w3-input w3-border w3-border-black w3-round-xxlarge w3-white w3-padding"
                 type="text" id="patente" name="patente" maxlength="11" placeholder="Ej: HKN279">
        </p>
        <p>
          <label for="peso_tara" class="w3-text-grey">Peso tara (kg)</label>
          <input class="w3-input w3-border w3-border-black w3-round-xxlarge w3-white w3-padding"
                 type="number" id="peso_tara" name="peso_tara" min="1" step="1" required>
        </p>
        <p>
          <label for="peso_bruto" class="w3-text-grey">Peso bruto (kg) <small>(opcional)</small></label>
          <input class="w3-input w3-border w3-border-black w3-round-xxlarge w3-white w3-padding"
                 type="number" id="peso_bruto" name="peso_bruto" min="1" step="1">
        </p>
        <p>
          <label for="supplier_id" class="w3-text-grey">Proveedor</label>
          <select class="w3-select w3-border w3-border-black w3-round-xxlarge w3-white w3-padding"
                  id="supplier_id" name="supplier_id" required>
            <option value="" disabled selected>Cargando proveedores...</option>
          </select>
        </p>
        <p>
          <label for="product_id" class="w3-text-grey">Producto <small>(opcional)</small></label>
          <select class="w3-select w3-border w3-border-black w3-round-xxlarge w3-white w3-padding"
                  id="product_id" name="product_id">
            <option value="" selected>Cargando productos...</option>
          </select>
        </p>
        <p class="w3-center">
          <button class="w3-button w3-light-green w3-round-xxlarge w3-padding-large" type="submit" style="min-width: 70%;">
            Registrar pesada
          </button>
        </p>
        <div id="mensaje" class="w3-panel w3-round" style="display: none;"></div>
      </form>
    </section>

    <!-- Columna central: acciones y estadísticas -->
    <section class="col col-centro">
      <div class="grupo-acciones">
        <h2><b>Acciones</b></h2>

        <button id="btn-cerrar" type="button" class="btn-accion w3-button w3-green w3-round-xxlarge">
          <b>Cerrar ticket</b><span class="flecha w3-circle w3-white w3-text-green">›</span>
        </button>
        <button id="btn-proveedor" type="button" class="btn-accion w3-button w3-green w3-round-xxlarge">
          <b>Cargar proveedor</b><span class="flecha w3-circle w3-white w3-text-green">›</span>
        </button>
        <button id="btn-producto" type="button" class="btn-accion w3-button w3-green w3-round-xxlarge">
          <b>Cargar producto</b><span class="flecha w3-circle w3-white w3-text-green">›</span>
        </button>
        <button id="btn-cliente" type="button" class="btn-accion w3-button w3-green w3-round-xxlarge">
          <b>Cargar cliente</b><span class="flecha w3-circle w3-white w3-text-green">›</span>
        </button>
        <button id="btn-backup" type="button" class="btn-accion w3-button w3-green w3-round-xxlarge"
                title="Descarga una copia completa de la base de datos (.sql)">
          <b>Descargar Backup DB</b><span class="flecha w3-circle w3-white w3-text-green">›</span>
        </button>
      </div>

      <div class="tarjeta-stat w3-light-grey w3-round-xlarge w3-padding-large">
        <b>Tickets totales del mes</b>
        <p class="w3-xxlarge w3-center"><b id="stat-tickets-mes">—</b></p>
      </div>

      <div class="tarjeta-stat w3-light-grey w3-round-xlarge w3-padding-large">
        <b>Proveedores con más tickets</b>
        <p class="w3-small w3-text-grey" style="margin-top: 0;">Este mes</p>
        <div id="lista-top-proveedores"></div>
      </div>
    </section>

    <!-- Columna derecha: tabla -->
    <section class="col col-tabla">
      <h4 id="titulo-tabla" class="titulo-tabla w3-center">Lista de tickets abiertos de hoy</h4>
      <div class="caja-punteada w3-round-xlarge w3-padding">
        <div class="w3-responsive">
          <table class="w3-table w3-bordered w3-hoverable w3-small">
            <thead>
              <tr class="w3-text-green">
                <th>ID</th>
                <th>Fecha</th>
                <th>Chofer</th>
                <th>Patente</th>
                <th>Proveedor</th>
                <th>Producto</th>
                <th>Tara</th>
                <th>Bruto</th>
                <th>Neto</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-historial">
              <tr><td colspan="11" class="w3-center">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal reutilizable (reemplaza prompt y alert) -->
  <div id="modal" class="w3-modal">
    <div class="w3-modal-content w3-card-4 w3-animate-top" style="max-width: 420px;">
      <header class="w3-container w3-green">
        <h3 id="modal-titulo"></h3>
      </header>
      <form id="modal-form" class="w3-container w3-padding-16">
        <p id="modal-texto"></p>
        <p id="modal-campo">
          <input id="modal-input" class="w3-input w3-border w3-round" autocomplete="off">
        </p>
        <p id="modal-error" class="w3-text-red w3-small" style="display: none;"></p>
        <div class="w3-right">
          <button type="button" id="modal-cancelar" class="w3-button w3-round w3-light-grey">Cancelar</button>
          <button type="submit" id="modal-aceptar" class="w3-button w3-round w3-green">Aceptar</button>
        </div>
        <div class="w3-clear"></div>
      </form>
    </div>
  </div>

  <!-- Modal de alta de cliente (varios campos) -->
  <div id="modal-cliente" class="w3-modal">
    <div class="w3-modal-content w3-card-4 w3-animate-top" style="max-width: 420px;">
      <header class="w3-container w3-green">
        <h3>Cargar cliente</h3>
      </header>
      <form id="form-cliente" class="w3-container w3-padding-16" novalidate>
        <p>
          <label for="cliente-username" class="w3-text-grey">Usuario</label>
          <input id="cliente-username" class="w3-input w3-border w3-round" maxlength="50" autocomplete="off">
        </p>
        <p>
          <label for="cliente-password" class="w3-text-grey">Contraseña <small>(mínimo 8 caracteres)</small></label>
          <input id="cliente-password" type="password" class="w3-input w3-border w3-round" autocomplete="new-password">
        </p>
        <p>
          <label for="cliente-password2" class="w3-text-grey">Repetir contraseña</label>
          <input id="cliente-password2" type="password" class="w3-input w3-border w3-round" autocomplete="new-password">
        </p>
        <p>
          <label for="cliente-proveedor" class="w3-text-grey">Proveedor</label>
          <select id="cliente-proveedor" class="w3-select w3-border w3-round"></select>
        </p>
        <p id="cliente-error" class="w3-text-red w3-small" style="display: none;"></p>
        <div class="w3-right">
          <button type="button" id="cliente-cancelar" class="w3-button w3-round w3-light-grey">Cancelar</button>
          <button type="submit" id="cliente-guardar" class="w3-button w3-round w3-green">Crear cliente</button>
        </div>
        <div class="w3-clear"></div>
      </form>
    </div>
  </div>

  <!-- Modal para editar un ticket (abierto o cerrado) -->
  <div id="modal-editar-ticket" class="w3-modal">
    <div class="w3-modal-content w3-card-4 w3-animate-top" style="max-width: 460px;">
      <header class="w3-container w3-green">
        <h3 id="editar-titulo">Editar ticket</h3>
      </header>
      <form id="form-editar" class="w3-container w3-padding-16" novalidate>
        <p>
          <label for="editar-fecha" class="w3-text-grey">Fecha</label>
          <input id="editar-fecha" type="date" class="w3-input w3-border w3-round">
        </p>
        <p>
          <label for="editar-chofer" class="w3-text-grey">Chofer</label>
          <input id="editar-chofer" class="w3-input w3-border w3-round" maxlength="200" autocomplete="off">
        </p>
        <p>
          <label for="editar-patente" class="w3-text-grey">Patente</label>
          <input id="editar-patente" class="w3-input w3-border w3-round" maxlength="11" autocomplete="off">
        </p>
        <p>
          <label for="editar-proveedor" class="w3-text-grey">Proveedor</label>
          <select id="editar-proveedor" class="w3-select w3-border w3-round"></select>
        </p>
        <p>
          <label for="editar-producto" class="w3-text-grey">Producto</label>
          <select id="editar-producto" class="w3-select w3-border w3-round"></select>
        </p>
        <div class="w3-row-padding" style="margin: 0 -16px;">
          <p class="w3-half">
            <label for="editar-tara" class="w3-text-grey">Peso tara (kg)</label>
            <input id="editar-tara" type="number" min="1" step="1" class="w3-input w3-border w3-round">
          </p>
          <p class="w3-half">
            <label for="editar-bruto" class="w3-text-grey" id="editar-bruto-label">Peso bruto (kg)</label>
            <input id="editar-bruto" type="number" min="1" step="1" class="w3-input w3-border w3-round">
          </p>
        </div>
        <p id="editar-ayuda" class="w3-small w3-text-grey"></p>
        <p class="w3-large">Peso neto: <b id="editar-neto">—</b></p>
        <p id="editar-error" class="w3-text-red w3-small" role="alert" style="display: none;"></p>
        <div class="w3-right">
          <button type="button" id="editar-cancelar" class="w3-button w3-round w3-light-grey">Cancelar</button>
          <button type="submit" id="editar-guardar" class="w3-button w3-round w3-green">Guardar cambios</button>
        </div>
        <div class="w3-clear"></div>
      </form>
    </div>
  </div>

  <button id="btn-tema" type="button" class="boton-tema" aria-label="Cambiar entre tema claro y oscuro">🌙 Modo oscuro</button>

  <script src="../js/auth.js"></script>
  <script src="../js/exportar.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
