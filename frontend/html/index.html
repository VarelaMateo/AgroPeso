<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroPeso - Registro de pesaje</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<body class="w3-light-grey">

  <header class="w3-container w3-green w3-center w3-padding-24">
    <h1>AgroPeso</h1>
    <p>Registro de pesaje</p>
  </header>

  <main class="w3-container w3-content w3-padding-32" style="max-width: 600px;">
    <form id="form-pesaje" class="w3-card-4 w3-white w3-container w3-padding-16">
      <h2 class="w3-center">Nueva pesada</h2>

      <p>
        <label for="chofer">Chofer</label>
        <input class="w3-input w3-border" type="text" id="chofer" name="chofer"
               maxlength="200" required>
      </p>

      <p>
        <label for="patente">Patente</label>
        <input class="w3-input w3-border" type="text" id="patente" name="patente"
               maxlength="11" placeholder="Ej: HKN279">
      </p>

      <div class="w3-row-padding" style="margin: 0 -16px;">
        <div class="w3-half">
          <label for="peso_tara">Peso tara (kg)</label>
          <input class="w3-input w3-border" type="number" id="peso_tara" name="peso_tara"
                 min="1" step="1" required>
        </div>
        <div class="w3-half">
          <label for="peso_bruto">Peso bruto (kg)</label>
          <input class="w3-input w3-border" type="number" id="peso_bruto" name="peso_bruto"
                 min="1" step="1" required>
        </div>
      </div>

      <p>
        <label for="supplier_id">Proveedor</label>
        <select class="w3-select w3-border" id="supplier_id" name="supplier_id" required>
          <option value="" disabled selected>Elegí un proveedor</option>
          <option value="1">Berg</option>
        </select>
      </p>

      <p>
        <button class="w3-button w3-green w3-block" type="submit">Registrar pesada</button>
      </p>

      <div id="mensaje" class="w3-panel" style="display: none;"></div>
    </form>
  </main>

</body>
</html>
