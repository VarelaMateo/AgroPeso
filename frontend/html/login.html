<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroPeso - Iniciar sesión</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<body class="w3-black">

  <main class="w3-content w3-padding-32" style="max-width: 400px; margin-top: 8vh;">
    <form id="form-login" class="w3-card-4 w3-dark-grey w3-container w3-padding-16 w3-border-top w3-border-green"
          style="border-top-width: 4px !important;">
      <h1 class="w3-center w3-text-green">AgroPeso</h1>
      <p class="w3-center w3-text-light-grey">Iniciar sesión</p>

      <p>
        <label for="username">Usuario</label>
        <input class="w3-input w3-border w3-black" type="text" id="username" name="username"
               autocomplete="username" maxlength="50" required autofocus>
      </p>

      <p>
        <label for="password">Contraseña</label>
        <input class="w3-input w3-border w3-black" type="password" id="password" name="password"
               autocomplete="current-password" maxlength="128" required>
      </p>

      <p>
        <button class="w3-button w3-green w3-block" type="submit">Ingresar</button>
      </p>

      <div id="mensaje" class="w3-panel w3-leftbar w3-pale-red w3-border-red" style="display: none;"></div>
    </form>
  </main>

  <script src="../js/auth.js"></script>
</body>
</html>
